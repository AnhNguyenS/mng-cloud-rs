# Include this inside the TLS server block that currently serves mng-cloud.
# Keep the existing PHP locations until the cutover is complete.
#
# mngd sets CSP, Trusted Types, COOP/CORP and cache headers itself. Do not add
# a second, conflicting CSP with `add_header` in this location.

location ^~ /app/ {
    limit_except GET HEAD { deny all; }

    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Local-only health probe. Do not expose /readyz publicly.
location = /api/v1/health {
    limit_except GET { deny all; }
    access_log off;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
