name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@wasm-pack
      - run: wasm-pack build crates/mng-wasm --release --target web --out-dir ../../dist/wasm
      - run: test -s dist/wasm/mng_wasm_bg.wasm
      - run: test -s dist/wasm/mng_wasm.js

  armv7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ziglang==0.16.0
      - run: ./tools/build-armv7.sh
      - run: file target/armv7-unknown-linux-musleabihf/release/mngd
      - run: sha256sum target/armv7-unknown-linux-musleabihf/release/mngd

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test extension/tests/trust.test.mjs
      - run: node --input-type=module --check < extension/src/trust.js
      - run: node --input-type=module --check < extension/src/background.js
      - run: node --input-type=module --check < extension/src/popup.js
      - run: node --check extension/src/content.js
      - run: node --check tools/e2e/extension-e2e.mjs
      - run: python tools/build-extension.py --out dist/extension
      - run: test -s dist/extension/manifest.json
      - run: test -s dist/extension/icons/128.png
