[workspace]
resolver = "2"
members = [
    "crates/mng-auth",
    "crates/mng-core",
    "crates/mng-db",
    "crates/mngd",
    "crates/mng-wasm",
    "crates/mng-sign",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["MNG Cloud"]
publish = false

[workspace.dependencies]
mng-auth = { path = "crates/mng-auth" }
mng-core = { path = "crates/mng-core" }
mng-db = { path = "crates/mng-db" }

aes = "0.8"
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.17"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "fs"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
wasm-bindgen = "0.2"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# wasm-bindgen needs the `target_features` custom section to detect enabled
# features; strip the native binary instead, and optimise the WASM separately.
[profile.release.package.mng-wasm]
strip = "none"
